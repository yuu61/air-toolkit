# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: all
  disable:
    # 未使用ライブラリ・技術に関連するリンター
    - arangolint
    - ginkgolinter
    - loggercheck
    - protogetter
    - spancheck
    - unqueryvet
    - zerologlint
    - rowserrcheck
    - sqlclosecheck
    - gosmopolitan
    
    # プロジェクトの性質（小規模CLI、画像処理など）に合わないもの
    - exhaustruct          # deprecated (replaced by exhaustruct_v5)
    - exhaustruct_v5       # 構造体の全フィールド初期化強制は冗長
    - varnamelen           # 短い変数名 (x, y等) を許容する
    - ireturn              # interface返却を許容
    - wrapcheck            # 内部エラーのラップ強制は小規模では過剰
    - err113               # sentinel errorの強制は過剰
    - testpackage          # 別パッケージでのテストを強制しない
    - paralleltest         # 今回のテストの性質上必須としない
    - tparallel
    - thelper
    
    # フォーマッタに任せる、またはスタイルとして過剰なもの
    - lll                  # 行長制限はフォーマッタに任せる
    - wsl                  # deprecated (replaced by wsl_v5)
    - wsl_v5               # 空行のスタイル制限は過剰
    - gomodguard           # deprecated (replaced by gomodguard_v2)
    - gomodguard_v2        # 版制約の検査は使わず、依存方向は depguard で検査する
    - nlreturn
    - tagalign
    - tagliatelle
    - godot                # コメント末尾のピリオド強制（日本語に合わない）
    - godox                # TODO/FIXMEコメントは許容
    - forbidigo
    - grouper
    - decorder
    - funcorder
    - inamedparam
    - interfacebloat
    - nonamedreturns
    - noinlineerr
    - embeddedstructfieldcheck
    - exhaustive
    - mnd                  # 画像処理の定数などで引っかかりやすいため無効化
    - gomoddirectives

  # default: all を使うことで、これら以外の有益なリンター (intrange, prealloc, perfsprint, modernize, fieldalignment など) はすべて有効になります。

  settings:
    depguard:
      # Each layer allows only itself, its declared dependencies, and stdlib.
      # Exact roots ($ suffix) and slash prefixes also cover future subpackages
      # without accidentally allowing similarly named sibling packages.
      # depguard's glob syntax needs separate patterns for direct and nested files.
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/domain/*.go"
            - "**/internal/domain/**/*.go"
          allow:
            - $gostd
            - github.com/yuu61/aironet/internal/domain$
            - github.com/yuu61/aironet/internal/domain/
        infrastructure:
          list-mode: strict
          files:
            - "**/internal/infrastructure/*.go"
            - "**/internal/infrastructure/**/*.go"
          allow:
            - $gostd
            - github.com/yuu61/aironet/internal/infrastructure$
            - github.com/yuu61/aironet/internal/infrastructure/
            - github.com/yuu61/aironet/internal/domain$
            - github.com/yuu61/aironet/internal/domain/
            - golang.org/x/net/html$
            - golang.org/x/net/html/
        application:
          list-mode: strict
          files:
            - "**/internal/application/*.go"
            - "**/internal/application/**/*.go"
          allow:
            - $gostd
            - github.com/yuu61/aironet/internal/application$
            - github.com/yuu61/aironet/internal/application/
            - github.com/yuu61/aironet/internal/infrastructure$
            - github.com/yuu61/aironet/internal/infrastructure/
            - github.com/yuu61/aironet/internal/domain$
            - github.com/yuu61/aironet/internal/domain/
        cli:
          list-mode: strict
          files:
            - "**/internal/cli/*.go"
            - "**/internal/cli/**/*.go"
          allow:
            - $gostd
            - github.com/yuu61/aironet/internal/cli$
            - github.com/yuu61/aironet/internal/cli/
            - github.com/yuu61/aironet/internal/application$
            - github.com/yuu61/aironet/internal/application/
        entrypoint:
          list-mode: strict
          files:
            - "**/cmd/manualbook/*.go"
            - "**/cmd/manualbook/**/*.go"
          allow:
            - $gostd
            - github.com/yuu61/aironet/internal/cli$
            - github.com/yuu61/aironet/internal/cli/
        unclassified:
          # New directories cannot bypass the layer rules through a helper package.
          list-mode: strict
          files:
            - $all
            - "!**/internal/domain/*.go"
            - "!**/internal/domain/**/*.go"
            - "!**/internal/infrastructure/*.go"
            - "!**/internal/infrastructure/**/*.go"
            - "!**/internal/application/*.go"
            - "!**/internal/application/**/*.go"
            - "!**/internal/cli/*.go"
            - "!**/internal/cli/**/*.go"
            - "!**/cmd/manualbook/*.go"
            - "!**/cmd/manualbook/**/*.go"
          allow:
            - $gostd
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
      disabled-checks:
        - hugeParam
        - unnamedResult
    revive:
      rules:
        - name: blank-imports
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true
        - name: cognitive-complexity
          disabled: true
    gosec:
      excludes:
        - G104
        - G301
        - G304
        - G306                # 資格情報を含まないマニュアル・索引・キャッシュを他の利用者も読める 0644 で出力する
        - G703                # 利用者が指定したローカル資料のパスを読む CLI
        - G115
    govet:
      enable-all: true
    nestif:
      min-complexity: 8

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/yuu61/aironet
